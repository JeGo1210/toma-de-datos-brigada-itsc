<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toma de Datos Brigada ITSC</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --primary: #0056b3;
      --secondary: #28a745;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #cccccc;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { background-color: var(--primary); color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
    header h1 { margin: 0 0 5px 0; font-size: 1.8rem; }
    header p { margin: 0; font-size: 0.95rem; opacity: 0.9; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 850px) { .grid { grid-template-columns: 380px 1fr; } }
    .card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .card h2 { margin-top: 0; color: var(--primary); font-size: 1.3rem; border-bottom: 2px solid var(--bg); padding-bottom: 8px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.95rem; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    .curso-inputs { display: flex; align-items: center; gap: 8px; }
    .curso-inputs input { text-align: center; }
    button { width: 100%; background: var(--secondary); color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .btn-danger { background: #dc3545; }
    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .stat-box { background: #eef6ff; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #cce5ff; }
    .stat-box .val { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
    .stat-box .lbl { font-size: 0.75rem; color: #555; }
    .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select { flex: 1; min-width: 140px; padding: 8px; border: 1px solid var(--border); border-radius: 4px; }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    th { background-color: #f8fafc; color: #475569; font-weight: 600; }
    tr:hover { background-color: #f1f5f9; }
    .tag { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .tag-normal { background: #d4edda; color: #155724; }
    .tag-warning { background: #fff3cd; color: #856404; }
    .tag-danger { background: #f8d7da; color: #721c24; }
    .help-info { font-size: 0.75rem; color: #666; margin-top: 2px; }
    .escudo-header {
    position: absolute;
    top: 20px;
    right: 20px;
    height: 100px; /* Ajusta el tamaño aquí */
    width: auto;
}
  </style>
</head>
<body>

<div class="container">
  <header>
    <img src="escudo.png" alt="Escudo del Colegio" class="escudo-header">
    <h1>Toma de Datos Brigada ITSC</h1>
    <p>Sistema de Registro Escolar de Señales Vitales y Datos de Salud</p>
  </header>

  <div class="grid">
    <div class="card">
      <h2>Nuevo Registro</h2>
      <form id="healthForm">
        <div class="form-row">
          <div class="form-group">
            <label for="fecha">Fecha *</label>
            <input type="date" id="fecha" required>
          </div>
          <div class="form-group">
            <label for="codigo">Código / ID *</label>
            <input type="text" id="codigo" placeholder="Ej: BRIG-101" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tipoUsuario">Rol / Tipo de Usuario *</label>
            <select id="tipoUsuario" required>
              <option value="Estudiante" selected>Estudiante</option>
              <option value="Docente">Docente</option>
              <option value="Visitante">Visitante</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
          <div class="form-group">
            <label for="edad">Edad (años) *</label>
            <input type="number" id="edad" placeholder="15" min="1" max="99" required>
          </div>
        </div>

        <div class="form-group" id="grupoCurso">
          <label>Grado / Curso *</label>
          <div class="curso-inputs">
            <input type="text" id="gradoNum" placeholder="Grado (1-11)" required maxlength="2">
            <span>°</span>
            <input type="text" id="grupoNum" placeholder="Grupo (1-9)" required maxlength="1">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="presion">Presión Arterial</label>
            <input type="text" id="presion" placeholder="120/80">
          </div>
          <div class="form-group">
            <label for="temperatura">Temp. (°C) *</label>
            <input type="text" id="temperatura" placeholder="36.5" required maxlength="5">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="peso">Peso (kg) *</label>
            <input type="text" id="peso" placeholder="65" required maxlength="6">
          </div>
          <div class="form-group">
            <label for="talla">Talla (cm) *</label>
            <input type="text" id="talla" placeholder="165" required maxlength="6">
          </div>
        </div>

        <div class="form-group">
          <label for="observaciones">Observaciones</label>
          <textarea id="observaciones" rows="2" placeholder="Notas adicionales..."></textarea>
        </div>

        <button type="submit">Guardar Registro</button>
      </form>
    </div>

    <div class="card">
      <h2>Resumen y Estadísticas</h2>
      <div class="stats-container">
        <div class="stat-box"><div class="val" id="statTotal">0</div><div class="lbl">Registros</div></div>
        <div class="stat-box"><div class="val" id="statEdad">0</div><div class="lbl">Prom. Edad</div></div>
        <div class="stat-box"><div class="val" id="statTemp">0 °C</div><div class="lbl">Prom. Temp</div></div>
        <div class="stat-box"><div class="val" id="statIMC">0</div><div class="lbl">Prom. IMC</div></div>
      </div>

      <h2>Consulta de Registros</h2>
      <div class="filter-bar">
        <input type="text" id="searchQuery" placeholder="Buscar por código...">
        <select id="filterUsuario">
          <option value="">Todos los roles</option>
          <option value="Estudiante">Estudiante</option>
          <option value="Docente">Docente</option>
          <option value="Visitante">Visitante</option>
          <option value="Otro">Otro</option>
        </select>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Fecha</th>
              <th>Código</th>
              <th>Rol</th>
              <th>Grado / Curso</th>
              <th>P. Art.</th>
              <th>Temp</th>
              <th>Peso/Talla</th>
              <th>IMC</th>
              <th>Obs.</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  let records = JSON.parse(localStorage.getItem('brigada_itsc_records')) || [];
  document.getElementById('fecha').value = new Date().toISOString().substring(0, 10);

  const form = document.getElementById('healthForm');
  const tipoUsuarioSelect = document.getElementById('tipoUsuario');
  const grupoCurso = document.getElementById('grupoCurso');
  const gradoNum = document.getElementById('gradoNum');
  const grupoNum = document.getElementById('grupoNum');
  const tableBody = document.getElementById('recordsTableBody');
  const searchQuery = document.getElementById('searchQuery');
  const filterUsuario = document.getElementById('filterUsuario');
  const presionInput = document.getElementById('presion');
  const temperaturaInput = document.getElementById('temperatura');
  const pesoInput = document.getElementById('peso');
  const tallaInput = document.getElementById('talla');

  // Validación Grado (1-11)
  gradoNum.addEventListener('input', (e) => {
    let val = e.target.value.replace(/[^0-9]/g, '');
    if (val !== '') {
      let num = parseInt(val, 10);
      if (num > 11) num = 11;
      if (num < 1) num = 1;
      val = num.toString();
    }
    e.target.value = val;
  });

  // Validación Grupo (1-9)
  grupoNum.addEventListener('input', (e) => {
    let val = e.target.value.replace(/[^0-9]/g, '');
    if (val !== '') {
      let num = parseInt(val, 10);
      if (num > 9) num = 9;
      if (num < 1) num = 1;
      val = num.toString();
    }
    e.target.value = val;
  });

  // Validación Presión Arterial (Solo números y /)
  presionInput.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/[^0-9/]/g, '');
  });

  // Permite números y máximo un punto decimal sin forzar formatos
  function cleanDecimalInput(input) {
    let val = input.value.replace(/[^0-9.]/g, '');
    const parts = val.split('.');
    if (parts.length > 2) {
      val = parts[0] + '.' + parts.slice(1).join('');
    }
    input.value = val;
  }

  temperaturaInput.addEventListener('input', () => cleanDecimalInput(temperaturaInput));
  pesoInput.addEventListener('input', () => cleanDecimalInput(pesoInput));
  tallaInput.addEventListener('input', () => cleanDecimalInput(tallaInput));

  tipoUsuarioSelect.addEventListener('change', () => {
    if (tipoUsuarioSelect.value === 'Estudiante') {
      grupoCurso.style.display = 'block';
      gradoNum.setAttribute('required', 'required');
      grupoNum.setAttribute('required', 'required');
    } else {
      grupoCurso.style.display = 'none';
      gradoNum.removeAttribute('required');
      grupoNum.removeAttribute('required');
      gradoNum.value = ''; 
      grupoNum.value = ''; 
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const peso = parseFloat(pesoInput.value) || 0;
    const tallaCm = parseFloat(tallaInput.value) || 0;
    const tallaM = tallaCm / 100;
    const imc = (tallaM > 0) ? (peso / (tallaM * tallaM)).toFixed(1) : 0;

    const rol = tipoUsuarioSelect.value;
    const cursoVal = (rol === 'Estudiante') ? `${gradoNum.value}°${grupoNum.value}` : 'N/A';

    const newRecord = {
      id: Date.now(),
      fecha: document.getElementById('fecha').value,
      codigo: document.getElementById('codigo').value.trim(),
      tipoUsuario: rol,
      edad: parseInt(document.getElementById('edad').value),
      curso: cursoVal,
      presion: presionInput.value.trim() || 'N/R',
      temperatura: parseFloat(temperaturaInput.value) || 0,
      peso: pesoInput.value.trim(),
      talla: tallaInput.value.trim(),
      imc: imc,
      observaciones: document.getElementById('observaciones').value.trim() || 'Sin observaciones'
    };

    records.unshift(newRecord);
    saveAndRender();
    form.reset();
    document.getElementById('fecha').value = new Date().toISOString().substring(0, 10);
    tipoUsuarioSelect.value = 'Estudiante';
    grupoCurso.style.display = 'block';
    gradoNum.setAttribute('required', 'required');
    grupoNum.setAttribute('required', 'required');
  });

  function deleteRecord(id) {
    if (confirm('¿Desea eliminar este registro?')) {
      records = records.filter(r => r.id !== id);
      saveAndRender();
    }
  }

  function saveAndRender() {
    localStorage.setItem('brigada_itsc_records', JSON.stringify(records));
    renderTable();
    renderStats();
  }

  function getImcTag(imc) {
    if (imc < 18.5) return `<span class="tag tag-warning">${imc} (Bajo)</span>`;
    if (imc <= 24.9) return `<span class="tag tag-normal">${imc} (Normal)</span>`;
    if (imc <= 29.9) return `<span class="tag tag-warning">${imc} (Sobrepeso)</span>`;
    return `<span class="tag tag-danger">${imc} (Obesidad)</span>`;
  }

  function getTempTag(temp) {
    if (temp < 36.0) return `<span class="tag tag-warning">${temp} °C</span>`;
    if (temp <= 37.5) return `<span class="tag tag-normal">${temp} °C</span>`;
    return `<span class="tag tag-danger">${temp} °C (Fiebre)</span>`;
  }

  function renderTable() {
    const q = searchQuery.value.toLowerCase();
    const u = filterUsuario.value;

    const filtered = records.filter(r => 
      r.codigo.toLowerCase().includes(q) && 
      (u === "" || r.tipoUsuario === u)
    );

    tableBody.innerHTML = filtered.map(r => `
      <tr>
        <td>#${r.id.toString().slice(-4)}</td>
        <td>${r.fecha}</td>
        <td><strong>${r.codigo}</strong></td>
        <td><small>${r.tipoUsuario}</small></td>
        <td>${r.curso}</td>
        <td>${r.presion}</td>
        <td>${getTempTag(r.temperatura)}</td>
        <td>${r.peso} kg / ${r.talla} cm</td>
        <td>${getImcTag(r.imc)}</td>
        <td><small>${r.observaciones}</small></td>
        <td><button onclick="deleteRecord(${r.id})" class="btn-danger" style="padding: 3px 8px; font-size: 0.75rem;">X</button></td>
      </tr>
    `).join('');

    if (filtered.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="11" style="text-align:center; color:#888;">No hay registros cargados.</td></tr>`;
    }
  }

  function renderStats() {
    const total = records.length;
    document.getElementById('statTotal').innerText = total;

    if (total === 0) {
      document.getElementById('statEdad').innerText = '0';
      document.getElementById('statTemp').innerText = '0 °C';
      document.getElementById('statIMC').innerText = '0';
      return;
    }

    const avgEdad = (records.reduce((acc, r) => acc + r.edad, 0) / total).toFixed(1);
    const avgTemp = (records.reduce((acc, r) => acc + parseFloat(r.temperatura), 0) / total).toFixed(1);
    const avgIMC = (records.reduce((acc, r) => acc + parseFloat(r.imc), 0) / total).toFixed(1);

    document.getElementById('statEdad').innerText = `${avgEdad} añ.`;
    document.getElementById('statTemp').innerText = `${avgTemp} °C`;
    document.getElementById('statIMC').innerText = avgIMC;
  }

  searchQuery.addEventListener('input', renderTable);
  filterUsuario.addEventListener('change', renderTable);

  renderStats();
  renderTable();
</script>
</body>
</html>
